[rpc]
primary_url = "http://127.0.0.1:8545"
# verifier_url = "wss://example.invalid/ws"

[indexer]
header_cache_size = 256
max_reorg_depth = 2048
# safe_depth = 12
# finalized_depth = 64

[abi]
enabled = false

# Register contract addresses against bundled decoders. Decoding updates the
# existing decoded_event/decoder_version columns; raw logs remain retained.
# [[abi.contracts]]
# address = "0x0000000000000000000000000000000000000000"
# standard = "erc20" # erc20, erc721, or uniswap_v3_pool
# decoder_version = "erc20:v1"

[queues]
fetch = 128
coordinate = 64
decode = 128
write = 64

[server]
listen_addr = "127.0.0.1:9100"

# Set secrets through CHAINWEAVE_DATABASE_URL and CHAINWEAVE_KAFKA_BROKERS.
# [expected_chain]
# chain_id = 31337
# genesis_hash = "0x..."
