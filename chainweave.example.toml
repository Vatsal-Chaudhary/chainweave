[rpc]
primary_url = "http://127.0.0.1:8545"
# verifier_url = "wss://example.invalid/ws"

[indexer]
header_cache_size = 256
max_reorg_depth = 2048
# safe_depth = 12
# finalized_depth = 64

[abi]
enabled = false

# Register contract addresses against bundled decoders. Decoding updates the
# existing decoded_event/decoder_version columns; raw logs remain retained.
# [[abi.contracts]]
# address = "0x0000000000000000000000000000000000000000"
# standard = "erc20" # erc20, erc721, or uniswap_v3_pool
# decoder_version = "erc20:v1"

[kafka]
# Set brokers through CHAINWEAVE_KAFKA__BROKERS or uncomment for local use.
brokers = []
outbox_topic = "chainweave.outbox"
consumer_group = "chainweave-demo-consumer"
queue_buffering_max_messages = 10000
delivery_timeout_ms = 30000
dispatcher_poll_ms = 1000

[queues]
fetch = 128
coordinate = 64
decode = 128
write = 64

[server]
listen_addr = "127.0.0.1:9100"

# Set database secrets through CHAINWEAVE_DATABASE_URL.
# [expected_chain]
# chain_id = 31337
# genesis_hash = "0x..."
